[project]
name = "enterprise-knowledge-orchestrator"
version = "0.1.0"
description = "Enterprise Knowledge Orchestrator — MCP, GraphRAG, A2A multi-agent Q&A"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "chromadb>=0.5.0",
    "langchain-text-splitters>=0.3.0",
    "networkx>=3.0",
    "streamlit>=1.40.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
