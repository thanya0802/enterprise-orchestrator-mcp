services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - ./audit_logs:/app/audit_logs
      - ./knowledge_graph.json:/app/knowledge_graph.json
      - ./mcp-servers/markdown-server/sample-docs:/app/mcp-servers/markdown-server/sample-docs

  research-agent:
    build: .
    command: uv run uvicorn agents.a2a_server:build_research_app --factory --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
    profiles:
      - a2a

  code-agent:
    build: .
    command: uv run uvicorn agents.a2a_server:build_code_app --factory --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
    profiles:
      - a2a
